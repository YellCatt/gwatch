name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: mipsle
            suffix: linux_mipsle
            goflags: CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat
            ldflags: "-s -w -extldflags=-static"
            tags: "netgo osusergo"
            upx: true
            upxflags: "--best"
          - os: linux
            arch: amd64
            suffix: linux_amd64
            goflags: GOOS=linux GOARCH=amd64
            ldflags: "-s -w"
            tags: ""
            upx: true
            upxflags: "--best --lzma"
          - os: linux
            arch: arm64
            suffix: linux_arm64
            goflags: GOOS=linux GOARCH=arm64
            ldflags: "-s -w"
            tags: ""
            upx: true
            upxflags: "--best --lzma"
          - os: windows
            arch: amd64
            suffix: windows_amd64
            goflags: GOOS=windows GOARCH=amd64
            ldflags: "-s -w"
            tags: ""
            upx: true
            upxflags: "--best --lzma"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Fix go modules
      run: |
        go clean -modcache
        go mod tidy

    - name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
      run: |
        VERSION="v1.0.0_$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
        echo "Building version: $VERSION"
        COMBINED_LDFLAGS="${{ matrix.target.ldflags }} -X gwatch/config.Version=$VERSION"
        ${{ matrix.target.goflags }} go build -ldflags="$COMBINED_LDFLAGS" ${{ matrix.target.tags != '' && format('-tags="{0}"', matrix.target.tags) || '' }} -o gwatch_${{ matrix.target.suffix }}.${{ matrix.target.os == 'windows' && 'exe' || '' }}
        ls -la gwatch_*

    - name: Install UPX
      if: ${{ matrix.target.upx == true }}
      run: |
        set -e
        UPX_VERSION="${UPX_VERSION:-5.0.1}"
        if curl -fsSL -o upx.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"; then
          tar -xf upx.tar.xz
          sudo install -m 755 "upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
        else
          sudo apt-get update && sudo apt-get install -y upx-ucl
        fi
        upx --version

    - name: Compress with UPX
      if: ${{ matrix.target.upx == true }}
      run: |
        BIN="gwatch_${{ matrix.target.suffix }}.${{ matrix.target.os == 'windows' && 'exe' || '' }}"
        BEFORE=$(stat -c%s "$BIN")
        if upx ${{ matrix.target.upxflags }} "$BIN" || upx --best "$BIN"; then
          AFTER=$(stat -c%s "$BIN")
          echo "UPX: $BEFORE -> $AFTER bytes"
        else
          echo "UPX 压缩失败，使用未压缩的原始二进制"
        fi
        ls -la gwatch_*

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gwatch_${{ matrix.target.suffix }}
        path: gwatch_${{ matrix.target.suffix }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "使用固定版本tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**Platforms:**%0A- Linux amd64%0A- Linux arm64%0A- Linux mipsle (极路由2 - 已禁用CGO，静态编译)%0A- Windows amd64" \
            --prerelease \
            artifacts/*