target:
  base_url: "https://localhost:8080"
  timeout: 30

log:
  level: "info"
  encoding: "json"
  output: "./logs/gwatch.log"

app:
  report_dir: "./reports"
  case_dir: "./cases"
  data_dir: "./sql"
  severe_status:
    - 500
  global_pre: []
  global_post: []
  host_name: ""

http:
  insecure_skip_verify: false

vars: {}

monitor:
  enabled: true
  default_interval: 60
  alert_on_failure: true
  alert_on_slow: true
  max_workers: 1
  alert_interval: 21600  # 同一接口异常后再次发送邮件的最小间隔（秒），默认 6 小时
  daily_report: true     # 是否启用每日报告
  report_time: "00:00"   # 每日报告生成时间（HH:MM）

scraper:
  enabled: true
  targets:
    - name: "同事主机监控"
      url: "http://192.168.1.100/api/status"
      method: GET
      timeout: 5s
      interval: 10
      enabled: true
      insecure_skip_verify: false
      headers:
        Authorization: "Bearer {{token}}"
      metrics:
        - name: cpu_usage
          path: "$.info.cpu.use_percent"
          alias: "CPU使用率"
          unit: "%"
          compare_op: "gt"           # 比较操作符：gt(大于), lt(小于), eq(等于), ge(大于等于), le(小于等于)
          warning_threshold: 70      # 警告阈值：超过70%警告
          threshold: 85              # 严重阈值：超过85%告警
          alert: true                # 启用告警
          # 自动处理百分比：接口返回0.45会自动转为45%，返回45保持45%
        - name: mem_used
          path: "$.info.memory.used"
          alias: "已用内存"
          unit: "MB"
        - name: mem_total
          path: "$.info.memory.total"
          alias: "总内存"
          unit: "MB"
        - name: mem_usage
          path: "$.info.memory.use_percent"
          alias: "内存使用率"
          unit: "%"
          compare_op: "gt"
          warning_threshold: 75
          threshold: 90
          alert: true
        - name: disk_usage
          path: "$.info.disk.root.usage"
          alias: "磁盘使用率"
          unit: "%"
          compare_op: "gt"
          warning_threshold: 80      # 80%警告
          threshold: 90              # 90%告警
          alert: true
        # 可选指标：某些接口可能不返回这些字段，不会报错
        - name: gpu_usage
          path: "$.info.gpu.use_percent"
          alias: "GPU使用率"
          unit: "%"
          optional: true
          compare_op: "gt"
          warning_threshold: 80
          threshold: 95
          alert: true
        - name: network_down
          path: "$.info.network.down_speed"
          alias: "网络下行速度"
          unit: "Mbps"
          optional: true
          compare_op: "lt"        # 网速过低告警（小于阈值）
          threshold: 10           # 低于10Mbps告警
          alert: true
        - name: network_up
          path: "$.info.network.up_speed"
          alias: "网络上行速度"
          unit: "Mbps"
          optional: true
          compare_op: "lt"        # 网速过低告警（小于阈值）
          threshold: 5            # 低于5Mbps告警
          alert: true

    

email:
  enabled: true
  from: "768305875@qq.com"
  to: "768305875@qq.com"
  auth_code: "gpfruabgjebubdad"
  smtp_server: "smtp.qq.com"
  smtp_port: 465


cleaner:
  enabled: true
  retention_days: 30
  log_dir: "./logs"
  report_dir: "./reports"
  data_dir: "./sql"
  include_patterns:
    - "*.log"
    - "*.json"
    - "*.csv"
    - "*.txt"
  exclude_patterns: []
  interval_hours: 24